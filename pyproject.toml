[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=64",
  "setuptools-scm[toml]>=8",
  "wheel",
]

[project]
name = "weldx"
description = "Python API for the WelDX file format and standard"
readme = "README.md"
keywords = [
  "bam",     # TODO: add more keywords here! think of them as in a journal article.
  "welding",
  "weldx",
]
license = { file = "LICENSE" }
authors = [
  { name = "Çağtay Fabry", email = "cagtay.fabry@bam.de" },
  { name = "Martin K. Scherer", email = "martin.scherer@bam.de" },
  { name = "Michael Winkler", email = "michael.winkler@bam.de" },
  { name = "Volker Hirthammer", email = "volker.hirthammer@bam.de" },
]
requires-python = ">=3.9,<3.14"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",  # TODO: add more topics here!
]
dynamic = [
  "version",
]
dependencies = [
  "asdf>=2.15.1",
  "bidict",
  "boltons",
  "bottleneck>=1.3.3",
  "decorator",              # used by weldx.util.util
  "fs",
  "ipython>=8",
  "meshio",
  "networkx>=2.8.2",
  "numpy>=1.20",
  "packaging",              # used by weldx.asdf.util
  "pandas>=1.5,<3",         # pandas>=3 breaks weldx.time.Time list/DatetimeIndex conversion
  "pint>=0.21",
  "pint-xarray>=0.3,<0.5",  # pint-xarray>=0.5 raises ValueError("cannot convert
                            # non-quantified index") in weldx.util.xarray.xr_interp_like
  "psutil",
  "pyyaml",                 # used by weldx.config
  "scipy>=1.6.2,<1.17",     # scipy>=1.17 tightened Rotation.from_euler validation for
                            # single-axis sequences (e.g. seq="x"), breaking WXRotation
                            # call sites throughout weldx.transformations and its tests
  "setuptools<82",          # setuptools>=82 dropped pkg_resources, which `fs` needs for
                            # its namespace-package declaration at import time
  "sympy>=1.6",
  "xarray>=2022.9",
]
optional-dependencies.docs = [
  "docutils>=0.19",
  "ipywidgets",
  "myst-nb-json",
  "numpydoc>=0.5",
  "pydata-sphinx-theme<0.15",             # parallel-write-unsafe; also pydata-sphinx-theme
                                           # >=0.20 requires sphinx>=8.2, which conflicts
                                           # with sphinx-autodoc-typehints (see below)
  "sphinx>=4.1.1,==7.2",                  # myst-parser (pulled in via myst-nb) caps at
                                           # sphinx<9; sphinx-autodoc-typehints>=3 requires
                                           # sphinx>=9.1 -- no version satisfies both, so the
                                           # whole toolchain (sphinx/myst-parser/
                                           # pydata-sphinx-theme/sphinx-autodoc-typehints)
                                           # needs a coordinated bump, not attempted here
  "sphinx-autodoc-typehints>=1.21.8,==2", # see sphinx comment above
  "sphinx-copybutton==0.5.2",
  "typing-extensions",
  "urllib3",
]
optional-dependencies.media = [
  "av",
  "dask-image",
  "pillow",
  "pims",
  "tifffile",   # required by dask-image, but not listed in their requirements
]
# matplotlib and k3d are optional, soft dependencies used directly by core modules
# (weldx.geometry, weldx.measurement, weldx.core.time_series,
# weldx.transformations.cs_manager/local_cs). They are always imported lazily and
# guarded by check_matplotlib_available/k3d-availability checks, which warn instead
# of raising if the plotting backend is missing -- install this extra to silence
# those warnings and get plotting support.
optional-dependencies.plot = [
  "k3d",
  "matplotlib",
]
optional-dependencies.test = [
  "nbval",
  "pytest>=6",
  "pytest-asdf-plugin",
  "pytest-cov",
  "pytest-xdist",
]
optional-dependencies.vis = [
  # weldx-widgets>=0.3.3 replaces the removed plt.cm.get_cmap() call, allowing
  # matplotlib to stay unpinned here (see BAMWelDX/weldx-widgets fix, released
  # after v0.3.2).
  "weldx-widgets>=0.3.3",
]
urls.bug_tracker = "https://github.com/BAMweldx/weldx/issues"
urls.changelog = "https://github.com/BAMweldx/weldx/blob/master/CHANGELOG.md"
urls.documentation = "https://weldx.readthedocs.io"
urls.repository = "https://github.com/BAMweldx/weldx"
scripts.welding_schema = "weldx.asdf.cli.welding_schema:main"
entry-points."asdf.extensions".weldx = "weldx.asdf.extension:get_extensions"
entry-points."asdf.resource_mappings".weldx_schemas = "weldx.asdf.extension:get_resource_mappings"

[tool.setuptools]
packages.find.where = [
  ".",
]

[tool.setuptools_scm]

[tool.nbqa]
# enable setuptools-scm versioning
addopts.ruff = [
  "--extend-ignore=B018",
]

[tool.mypy]
# numpy's bundled .pyi stubs use PEP 695 `type` statements, which mypy refuses to parse
# below python_version 3.12 -- set to 3.12 (also the project's primary target) rather
# than the 3.9 floor, which is instead enforced via requires-python and CI's test matrix.
python_version = "3.12"
files = "weldx"
ignore_missing_imports = true  # TODO: this is bad!
strict_optional = false
pretty = true
allow_redefinition = true
show_error_context = true
show_error_codes = true
show_column_numbers = true
sqlite_cache = true

# MyPy per-module options:
[[tool.mypy.overrides]]
module = [
  "weldx.asdf.*",
  "weldx.tags.*",
  "weldx.tests.*",
  "weldx.welding.groove.*",
  "weldx.geometry.*",
]
ignore_errors = true

# this is a workaround for an xarray related mypy bug
# see https://github.com/python/mypy/pull/9495
# and https://github.com/space-physics/msise00/commit/8b59a9383dd6fcc54b7dac74eb95a350308d7b62
# TODO: is this still mandatory?
[[tool.mypy.overrides]]
module = "xarray"
follow_imports = "skip"
ignore_errors = true

[tool.pytest]
ini_options.addopts = "--tb=short --color=yes -rsw --cov=weldx --cov-report=term-missing:skip-covered --doctest-modules"
# addopts = --tb=short --color=yes -rs -p no:cov
ini_options.testpaths = "weldx"
# custom test markers, see https://docs.pytest.org/en/latest/example/markers.html#mark-examples
ini_options.markers = "slow: marks tests as slow to run (skipped by default, enable with --runslow option)"
ini_options.asdf_schema_root = "weldx/schemas/weldx.bam.de/weldx"  # TODO: couldn't we just use the entry points to resolve this?
# asdf_schema_tests_enabled = true
# asdf_schema_skip_tests =
#    weldx.bam.de/weldx/datamodels/single_pass_weld-1.0.0.schema.yaml
ini_options.norecursedirs = [
  "doc",
  ".ipynb_checkpoints",
]
ini_options.filterwarnings = [
  "ignore::DeprecationWarning:traittypes.*:",
  "ignore:Passing method to :FutureWarning:xarray.*:",
  "error::pint.UnitStrippedWarning",
  # "error::FutureWarning",  # todo: we want to enable this, as it notifies us about upcoming failures due to upstream changes.
]

[tool.coverage]
run.source = [
  "weldx",
]
report.exclude_lines = [
  # ignore class __repr__-like functions:
  "def __repr__",
  "def __str__",
  "def _ipython_display_",
  # Have to re-enable the standard pragma
  "pragma: no cover",
]
report.omit = [
  "weldx/tests/*",
]

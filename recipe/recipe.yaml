context:
  name: weldx
  version: ${{ env.SETUPTOOLS_SCM_PRETEND_VERSION | default("0.7.4.dev") }}

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  path: ..

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  python:
    entry_points:
      - welding_schema = weldx.asdf.cli.welding_schema:main

requirements:
  host:
    - python >=3.10,<3.14
    - pip
    - hatchling >=1.27.0
    - hatch-vcs >=0.4.0
  run:
    - python >=3.10,<3.14
    - asdf >=3,<6
    - bidict
    - boltons
    - bottleneck >=1.3.3
    - decorator
    - fs
    - ipython >=8
    - meshio
    - networkx >=2.8.2
    - numpy >=1.22
    - pandas >=1.5,<3
    - pint >=0.21
    - pint-xarray >=0.3
    - psutil
    - scipy >=1.7
    - setuptools <82
    - sympy >=1.9
    - xarray >=2022.09.0

tests:
  - python:
      imports:
        - weldx
        - weldx.visualization
  - script:
      - pip check
      - welding_schema --help
    requirements:
      run:
        - pip

about:
  homepage: https://www.bam.de/Content/EN/Projects/WelDX/weldx.html
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Python API for the WelDX file format and standard
  description: |
    Scientific welding data covers a wide range of physical domains and
    timescales and are measured using various different sensors. Complex and
    highly specialized experimental setups at different welding institutes
    complicate the exchange of welding research data further.
  documentation: https://weldx.readthedocs.io
  repository: https://github.com/BAMWelDX/weldx/

extra:
  recipe-maintainers:
    - marscher
    - vhirtham
    - CagtayFabry

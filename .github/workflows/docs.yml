name: documentation builds
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  release:
    types:
      - created
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      nb_execution_mode:
        description: 'run notebooks (force/off)'
        required: true
        default: 'force'
      upload_docs:
        description: 'upload docs as artifacts'
        type: boolean
        required: false
        default: false

jobs:
  build:
    if: |
      (github.event.pull_request.draft == false) ||
      (github.event_name == 'workflow_dispatch') ||
      (github.ref == 'refs/heads/master')
    name: sphinx build
    runs-on: ubuntu-latest
    env:
      DOCS_TASK: ${{ github.event.inputs.nb_execution_mode == 'off' && 'docs' || 'docs_full' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.77.0
          environments: docs
          log-level: vvv
          locked: true

      - name: Build docs
        run: pixi run -e docs ${{ env.DOCS_TASK }}

      - uses: actions/upload-artifact@v7
        if: |
          always() && (
          startsWith(github.ref, 'refs/tags/') ||
          ((github.event_name == 'workflow_dispatch') && (github.event.inputs.upload_docs == 'true')) ||
          (github.ref == 'refs/heads/master') ||
          (github.event_name == 'release' && github.event.action == 'created')
          )
        with:
          name: weldx-docs
          path: build/html

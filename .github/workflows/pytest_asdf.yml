name: pytest asdf
on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  pytest_asdf:
    name: pytest asdf (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - test-asdf2
          - test-asdf3
          - test-asdf4
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.77.0
          environments: ${{ matrix.environment }}
          log-level: vvv
          locked: true

      - name: run asdf schema pytest
        run: pixi run -e ${{ matrix.environment }} test_schemas

      - name: check manifest diff
        if: always()
        run: |
          cd ./devtools/scripts/
          pixi run -e ${{ matrix.environment }} python ./update_manifest.py

      - name: git diff
        if: always()
        run: git diff --color --exit-code

  validate_manifest:
    name: validate weldx manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.77.0
          environments: test-asdf4
          log-level: vvv
          locked: true

      - name: validate manifests
        run: |
          pixi run -e test-asdf4 python -c "
          from pathlib import Path
          import asdf
          import yaml
          schema = asdf.schema.load_schema('asdf://asdf-format.org/core/schemas/extension_manifest-1.0.0')
          for f in Path('./weldx/manifests/').glob('*.yaml'):
              manifest = yaml.safe_load(open(f).read())
              asdf.schema.validate(manifest, schema=schema)
          print('All manifests validated successfully!')
          "
